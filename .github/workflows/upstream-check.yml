name: Upstream version check

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream tags and digests
        run: bash .github/scripts/upstream-check.sh

      - name: Open version-bump PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/upstream-bump
          title: "chore: bump pinned upstream image digests"
          commit-message: "chore: bump pinned upstream image digests"
          body: |
            Automated weekly pin refresh from Docker Hub.

            - n8n: latest stable tag + digest
            - Evolution API: latest **v2.3.x only** (v2.4.0+ requires Evolution
              Foundation license activation — the check script enforces this ceiling)

            Review the upstream changelogs, then run a from-scratch test deploy
            before merging (see CLAUDE.md §5 maintenance loop).
